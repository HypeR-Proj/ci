name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Quality / source and host tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Install source analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ripgrep shellcheck dosfstools mtools e2fsprogs squashfs-tools
      - name: Check shell test infrastructure
        run: sh tests/ci/run.sh scripts
      - name: Check formatting and host-side behavior
        run: sh tests/ci/run.sh quality

  aarch64-build:
    name: AArch64 / build and image checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Build production and self-test images
        run: sh tests/ci/run.sh aarch64-build
      - name: Upload AArch64 images
        uses: actions/upload-artifact@v4
        with:
          name: aarch64-kernels
          path: kernel/target/ci/aarch64
          if-no-files-found: error
          retention-days: 7

  native:
    name: AArch64 / SDK, apps and guest VMs
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Install Native SDK and QEMU tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            clang cmake cpio lld llvm make qemu-system-arm shellcheck squashfs-tools
      - name: Build and consume the Native SDK
        run: sh tests/ci/run.sh native
      - name: Clean up AArch64 QEMU
        if: always()
        run: sh tests/ci/cleanup-qemu.sh aarch64
      - name: Upload Native runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aarch64-native-logs
          path: |
            target/app/aarch64/native-init.log
            target/app/aarch64/native-gicv*-*.log
            target/app/aarch64/runtime-crash.log
            target/app/aarch64/apps.log
            target/app/aarch64/console.log
            target/app/aarch64/guest-smp.log
            target/stack-audit/aarch64/*.json
            target/stack-audit/aarch64/*.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload the Native SDK
        uses: actions/upload-artifact@v4
        with:
          name: hyper-sdk-aarch64-linux-x86_64
          path: target/sdk/aarch64
          if-no-files-found: error
          retention-days: 7

  board-storage:
    name: AArch64 / board storage and managed VM lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: quality
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d
        with:
          version: 1.3.0
      - name: Install deployment and QEMU tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            clang cmake cpio lld llvm make qemu-system-arm dosfstools mtools e2fsprogs squashfs-tools device-tree-compiler
      - name: Verify persistent Native storage and managed guests
        run: sh tests/ci/run.sh board-storage
      - name: Clean up AArch64 QEMU
        if: always()
        run: sh tests/ci/cleanup-qemu.sh aarch64
      - name: Upload board acceptance diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aarch64-board-storage-logs
          path: target/board-tests/**/*.log
          if-no-files-found: ignore
          retention-days: 7

  riscv64-native:
    name: RISC-V / SDK, apps and guest VM
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Install Native SDK and RISC-V QEMU tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            clang cmake cpio lld llvm make qemu-system-misc shellcheck
      - name: Verify RISC-V Native applications and userspace Linux VMs
        run: sh tests/ci/run.sh riscv64-native
      - name: Clean up RISC-V QEMU
        if: always()
        run: sh tests/ci/cleanup-qemu.sh riscv64
      - name: Upload RISC-V Native diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riscv64-native-logs
          path: |
            target/app/riscv64/*.log
            target/stack-audit/riscv64/*.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload the RISC-V Native SDK
        uses: actions/upload-artifact@v4
        with:
          name: hyper-sdk-riscv64-linux-x86_64
          path: target/sdk/riscv64
          if-no-files-found: error
          retention-days: 7

  aarch64-qemu:
    name: AArch64 / kernel self-tests / ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: aarch64-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: gicv3-up
            name: GICv3, 1 CPU
            cpu: max
            cpus: 1
            memory: 512M
            atomic_backend: LSE
            image: hyper.self-test.img
            va_bits: 48
            pa_bits: '[0-9][0-9]'
          - id: gicv3-smp
            name: GICv3, 4 CPUs
            cpu: max
            cpus: 4
            memory: 512M
            atomic_backend: LSE
            image: hyper.self-test.img
            va_bits: 48
            pa_bits: '[0-9][0-9]'
          - id: gicv3-low-memory
            name: GICv3, 256 MiB RAM
            cpu: max
            cpus: 2
            memory: 256M
            atomic_backend: LSE
            image: hyper.self-test.img
            va_bits: 48
            pa_bits: '[0-9][0-9]'
          - id: gicv2-smp
            name: GICv2, 4 CPUs
            cpu: max
            cpus: 4
            memory: 512M
            atomic_backend: LSE
            image: hyper.self-test.img
            va_bits: 48
            pa_bits: '[0-9][0-9]'
            gic_version: 2
          - id: gicv3-compact-address-space
            name: GICv3, compact address space
            cpu: max
            cpus: 4
            memory: 512M
            atomic_backend: LSE
            image: hyper.compact.img
            va_bits: 42
            pa_bits: 40
    steps:
      - uses: actions/checkout@v4
      - name: Download AArch64 self-test image
        uses: actions/download-artifact@v4
        with:
          name: aarch64-kernels
          path: kernel/target/ci/aarch64
      - name: Install AArch64 QEMU
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends binutils-aarch64-linux-gnu cpio qemu-system-arm
      - name: Reject AArch64 CPUs without FEAT_VHE
        if: matrix.id == 'gicv3-up'
        working-directory: kernel
        run: |
          python3 tests/qemu/verify-vhe-required.py qemu-system-aarch64 \
            target/ci/aarch64/hyper.self-test.img \
            target/ci/aarch64/hyper.self-test aarch64-linux-gnu-nm
      - name: Verify AArch64 runtime feature contract
        env:
          QEMU_CPU: ${{ matrix.cpu }}
          QEMU_CPUS: ${{ matrix.cpus }}
          QEMU_GIC_VERSION: ${{ matrix.gic_version || 3 }}
          QEMU_MEMORY: ${{ matrix.memory }}
          QEMU_EXPECT_ATOMIC_BACKEND: ${{ matrix.atomic_backend }}
          QEMU_EXPECT_VA_BITS: ${{ matrix.va_bits }}
          QEMU_EXPECT_PA_BITS: ${{ matrix.pa_bits }}
          AARCH64_TEST_IMAGE: target/ci/aarch64/${{ matrix.image }}
          QEMU_TEST_LOG: target/ci/logs/aarch64-${{ matrix.id }}.log
        run: sh tests/ci/run.sh aarch64-qemu
      - name: Clean up AArch64 QEMU
        if: always()
        run: sh tests/ci/cleanup-qemu.sh aarch64
      - name: Upload AArch64 serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aarch64-${{ matrix.id }}-log
          path: kernel/target/ci/logs/aarch64-${{ matrix.id }}.log
          if-no-files-found: warn
          retention-days: 7

  riscv64-qemu:
    name: RISC-V / kernel self-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Install RISC-V QEMU
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cpio qemu-system-misc
      - name: Verify RISC-V kernel startup and self-tests
        run: sh tests/ci/run.sh riscv64-qemu
      - name: Clean up RISC-V QEMU
        if: always()
        run: sh tests/ci/cleanup-qemu.sh riscv64
      - name: Upload RISC-V serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riscv64-kernel-log
          path: kernel/target/ci/logs/riscv64.log
          if-no-files-found: warn
          retention-days: 7

  x86_64-build:
    name: x86-64 / build checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Compile and link x86-64
        run: sh tests/ci/run.sh x86_64-build
