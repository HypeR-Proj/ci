name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Quality / source and host tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Install source analysis tools
        uses: ./.github/actions/tools
        with:
          packages: ripgrep shellcheck dosfstools mtools e2fsprogs erofs-utils squashfs-tools
      - name: Check shell test infrastructure
        run: sh tests/ci/run.sh scripts
      - name: Check formatting and host-side behavior
        run: sh tests/ci/run.sh quality

  kernel-configurations:
    name: Kernel / production and test feature gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Compile feature combinations and verify test admission
        run: sh tests/ci/run.sh kernel-configurations
      - name: Upload configuration diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kernel-configurations
          path: |
            kernel/target/ci/features/*.log
            kernel/target/ci/features/*.json
          if-no-files-found: ignore
          retention-days: 7

  aarch64-build:
    name: AArch64 / build / ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        variant: [production, self-test, compact]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Build and verify image variant
        run: sh tests/ci/run.sh aarch64-${{ matrix.variant }}
      - name: Upload AArch64 images
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aarch64-kernels-${{ matrix.variant }}
          path: kernel/target/ci/aarch64
          if-no-files-found: error
          retention-days: 7

  native-fixture:
    name: ${{ matrix.arch }} / Native fixture build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, riscv64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/tools
        with:
          packages: clang cmake cpio lld llvm make squashfs-tools
      - name: Build the immutable Native fixture
        env:
          CI_ARCH: ${{ matrix.arch }}
        run: sh tests/ci/run.sh native-fixture
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-fixture-${{ matrix.arch }}
          path: target/ci/native-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7

  native-interactive:
    name: ${{ matrix.arch }} / ${{ matrix.suite }}${{ matrix.arch == 'aarch64' && format(' / GICv{0}', matrix.gic) || '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: native-fixture
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, riscv64]
        suite: [native-boot, native-console, native-terminal, native-apps, native-shell, native-stress]
        gic: [3]
        include:
          - arch: aarch64
            suite: native-boot
            gic: 2
          - arch: aarch64
            suite: native-console
            gic: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-fixture-${{ matrix.arch }}
          path: target/ci/native-${{ matrix.arch }}
      - uses: ./.github/actions/tools
        with:
          packages: ${{ matrix.arch == 'aarch64' && 'qemu-system-arm' || 'qemu-system-misc' }}
      - name: Run Native probe using this run's images
        env:
          CI_ARCH: ${{ matrix.arch }}
          CI_NATIVE_FIXTURE: target/ci/native-${{ matrix.arch }}
          QEMU_MACHINE: ${{ matrix.arch == 'aarch64' && format('virt,virtualization=on,gic-version={0},dtb-randomness=on', matrix.gic) || 'virt' }}
        run: sh tests/ci/run.sh "${{ matrix.suite }}"
      - name: Clean up QEMU
        if: always()
        run: sh tests/ci/cleanup-qemu.sh "${{ matrix.arch }}"
      - name: Upload Native runtime diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.arch }}-${{ matrix.suite }}-${{ matrix.gic || 'none' }}-logs
          path: |
            target/app/${{ matrix.arch }}/*.log
            target/app/${{ matrix.arch }}/*.log.commands/**
            target/app/${{ matrix.arch }}/lifecycle-stress-*.json
          if-no-files-found: ignore
          retention-days: 7

  native:
    name: AArch64 / ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: native-sdk
            name: SDK and app contracts
          - suite: native-services
            name: Service lifecycle and journal
            gic: 3
          - suite: native-fleet
            name: Fleet configuration
          - suite: native-storage-recovery
            name: Storage and handoff failure recovery
          - suite: native-filesystem
            name: Filesystem failure
          - suite: native-runtime-crash
            name: Runtime crash / GICv3
            gic: 3
          - suite: native-runtime-crash
            name: Runtime crash / GICv2
            gic: 2
          - suite: native-vm
            name: VM authority and GICv3 traps
          - suite: native-smp-gicv3
            name: Guest SMP / GICv3
          - suite: native-smp-gicv2-guest
            name: Guest SMP / GICv2
          - suite: native-smp-gicv2-retirement
            name: SMP runtime retirement / GICv2
          - suite: native-smp-overcommit
            name: Guest SMP / host overcommit
          - suite: native-retirement-stack
            name: Power retirement and stack limits
          - suite: native-pmu
            name: PMUv3 sampling and flame graphs
          - suite: native-stack-16k
            name: Native boot / 16 KiB kernel stacks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Install Native SDK and QEMU tools
        uses: ./.github/actions/tools
        with:
          packages: clang cmake cpio lld llvm make shellcheck ${{ matrix.suite != 'native-sdk' && 'qemu-system-arm squashfs-tools' || '' }}
      - name: Run Native validation shard
        env:
          QEMU_MACHINE: virt,virtualization=on,gic-version=${{ matrix.gic || 3 }},dtb-randomness=on
        run: sh tests/ci/run.sh "${{ matrix.suite }}"
      - name: Clean up AArch64 QEMU
        if: always()
        run: sh tests/ci/cleanup-qemu.sh aarch64
      - name: Upload Native runtime diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aarch64-${{ matrix.suite }}-${{ matrix.gic || 3 }}-logs
          path: |
            target/app/aarch64/*.log
            target/app/aarch64/pmu-*.jsonl
            target/app/aarch64/pmu-*.folded
            target/app/aarch64/pmu-*.svg
            target/app/aarch64/services.*/*.log
            target/app/aarch64/retirement.*/**/*.log
            target/app/aarch64/service-failure.*/**/*.log
            target/app/aarch64/storage-failure/*.log
            target/app/aarch64/**/*.log.commands/**
            target/stack-audit/aarch64/*.json
            target/stack-audit/aarch64/*.log
            target/ci/aarch64-stack16.config
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload the Native SDK
        if: matrix.suite == 'native-sdk'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hyper-sdk-aarch64-linux-x86_64
          path: target/sdk/aarch64
          if-no-files-found: error
          retention-days: 7

  board-storage:
    name: AArch64 / ${{ matrix.suite == 'native-trace' && 'Static tracepoints and Perfetto export' || matrix.suite }}
    runs-on: ubuntu-24.04
    container: debian:trixie-slim
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Trace capture uses the real PCI storage backend and needs SMMUv3
        # stage 2, just like the other disk-backed acceptance workloads.
        suite: [board-storage-media, board-boot-system, board-alpine-rootfs, board-business, board-broker, board-userspace-device, board-product-config, native-trace]
    permissions:
      contents: read
      packages: read
    steps:
      # Prepare a minimal container before checkout and the local setup actions.
      - name: Bootstrap Debian tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          timeout --kill-after=10s 90s apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=15 update --error-on=any
          apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=15 install -y --no-install-recommends \
            ca-certificates git python3 rustup build-essential curl xz-utils zstd unzip
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4
        with:
          version: 1.3.0
      - name: Install deployment and QEMU tools
        uses: ./.github/actions/tools
        with:
          packages: clang cmake cpio lld llvm make qemu-system-arm dosfstools mtools e2fsprogs erofs-utils squashfs-tools device-tree-compiler
      - name: Verify board deployment and runtime contracts
        run: sh tests/ci/run.sh "${{ matrix.suite }}"
      - name: Capture low-stack call chains after storage failure
        if: failure() && matrix.suite == 'board-storage-media'
        timeout-minutes: 3
        run: |
          python3 -B tests/qemu/watch-stack.py \
            --image kernel/target/aarch64-unknown-none-softfloat/kernel/hyper.img \
            --elf kernel/target/aarch64-unknown-none-softfloat/kernel/hyper \
            --config target/ci/aarch64-stack16.config \
            --output target/board-tests/stack-watch
      - name: Clean up AArch64 QEMU
        if: always()
        run: sh tests/ci/cleanup-qemu.sh aarch64
      - name: Upload board acceptance diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aarch64-${{ matrix.suite }}-logs
          path: |
            target/board-tests/**/*.log
            target/board-tests/**/*.log.commands/**
            target/board-tests/**/product.config
            target/board-tests/**/accept.json
            target/board-tests/stack-watch/report.json
            target/app/aarch64/trace-*.log
            target/app/aarch64/trace-*.json
            target/app/aarch64/trace-*.artifacts/*
            target/ci/aarch64-stack16.config
          if-no-files-found: ignore
          retention-days: 7

  riscv64-native:
    name: RISC-V / ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: riscv64-sdk
            name: SDK and app contracts
          - suite: riscv64-vm
            name: Guest VM, retirement and stacks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Install Native SDK and RISC-V QEMU tools
        uses: ./.github/actions/tools
        with:
          packages: clang cmake cpio lld llvm make shellcheck ${{ matrix.suite == 'riscv64-vm' && 'qemu-system-misc' || '' }}
      - name: Verify RISC-V Native applications and userspace Linux VMs
        run: sh tests/ci/run.sh "${{ matrix.suite }}"
      - name: Clean up RISC-V QEMU
        if: always()
        run: sh tests/ci/cleanup-qemu.sh riscv64
      - name: Upload RISC-V Native diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.suite }}-logs
          path: |
            target/app/riscv64/*.log
            target/app/riscv64/**/*.log.commands/**
            target/stack-audit/riscv64/*.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload the RISC-V Native SDK
        if: matrix.suite == 'riscv64-sdk'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hyper-sdk-riscv64-linux-x86_64
          path: target/sdk/riscv64
          if-no-files-found: error
          retention-days: 7

  aarch64-qemu:
    name: AArch64 / kernel self-tests / ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: aarch64-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: gicv3-up
            name: GICv3, 1 CPU
            cpu: max
            cpus: 1
            memory: 512M
            atomic_backend: LSE
            image: hyper.self-test.img
            va_bits: 48
            pa_bits: '[0-9][0-9]'
          - id: gicv3-smp
            name: GICv3, 4 CPUs
            cpu: max
            cpus: 4
            memory: 512M
            atomic_backend: LSE
            image: hyper.self-test.img
            va_bits: 48
            pa_bits: '[0-9][0-9]'
          - id: gicv3-low-memory
            name: GICv3, 256 MiB RAM
            cpu: max
            cpus: 2
            memory: 256M
            atomic_backend: LSE
            image: hyper.self-test.img
            va_bits: 48
            pa_bits: '[0-9][0-9]'
          - id: gicv2-smp
            name: GICv2, 4 CPUs
            cpu: max
            cpus: 4
            memory: 512M
            atomic_backend: LSE
            image: hyper.self-test.img
            va_bits: 48
            pa_bits: '[0-9][0-9]'
            gic_version: 2
          - id: gicv3-compact-address-space
            name: GICv3, compact address space and dynamic Thread growth
            variant: compact
            cpu: max
            cpus: 4
            memory: 512M
            atomic_backend: LSE
            image: hyper.compact.img
            va_bits: 42
            pa_bits: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download AArch64 self-test image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: aarch64-kernels-${{ matrix.variant || 'self-test' }}
          path: kernel/target/ci/aarch64
      - name: Install AArch64 QEMU
        uses: ./.github/actions/tools
        with:
          packages: binutils-aarch64-linux-gnu cpio qemu-system-arm
      - name: Reject AArch64 CPUs without FEAT_VHE
        if: matrix.id == 'gicv3-up'
        working-directory: kernel
        run: |
          python3 tests/qemu/verify-vhe-required.py qemu-system-aarch64 \
            target/ci/aarch64/hyper.self-test.img \
            target/ci/aarch64/hyper.self-test aarch64-linux-gnu-nm
      - name: Verify AArch64 runtime feature contract
        env:
          QEMU_CPU: ${{ matrix.cpu }}
          QEMU_CPUS: ${{ matrix.cpus }}
          QEMU_GIC_VERSION: ${{ matrix.gic_version || 3 }}
          QEMU_MEMORY: ${{ matrix.memory }}
          QEMU_EXPECT_ATOMIC_BACKEND: ${{ matrix.atomic_backend }}
          QEMU_EXPECT_VA_BITS: ${{ matrix.va_bits }}
          QEMU_EXPECT_PA_BITS: ${{ matrix.pa_bits }}
          AARCH64_TEST_IMAGE: target/ci/aarch64/${{ matrix.image }}
          QEMU_TEST_LOG: target/ci/logs/aarch64-${{ matrix.id }}.log
        run: sh tests/ci/run.sh aarch64-qemu
      - name: Clean up AArch64 QEMU
        if: always()
        run: sh tests/ci/cleanup-qemu.sh aarch64
      - name: Upload AArch64 serial log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aarch64-${{ matrix.id }}-log
          path: kernel/target/ci/logs/aarch64-${{ matrix.id }}.log
          if-no-files-found: warn
          retention-days: 7

  riscv64-qemu:
    name: RISC-V / kernel self-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Install RISC-V QEMU
        uses: ./.github/actions/tools
        with:
          packages: cpio qemu-system-misc
      - name: Verify RISC-V kernel startup and self-tests
        run: sh tests/ci/run.sh riscv64-qemu
      - name: Clean up RISC-V QEMU
        if: always()
        run: sh tests/ci/cleanup-qemu.sh riscv64
      - name: Upload RISC-V serial log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: riscv64-kernel-log
          path: kernel/target/ci/logs/riscv64.log
          if-no-files-found: warn
          retention-days: 7

  x86_64-build:
    name: x86-64 / build checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Install image build tools
        uses: ./.github/actions/tools
        with:
          packages: device-tree-compiler
      - name: Compile and link x86-64
        run: sh tests/ci/run.sh x86_64-build
