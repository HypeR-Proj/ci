# Linux and appliance builds/publication belong to HypeR-io-vm. This workflow
# consumes its published package to test the current HypeR kernel and apps.
name: HypeR / I/O VM integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      reference:
        description: Published package digest to test (defaults to scripts/io-vm.lock.json)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: io-vm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  storage:
    name: AArch64 / cross-VM physical storage
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4
        with:
          version: 1.3.0
      - name: Install SDK and QEMU tools
        uses: ./.github/actions/tools
        with:
          packages: clang cmake cpio lld llvm make qemu-system-arm squashfs-tools
      - name: Test HypeR against the published I/O VM package
        env:
          IO_VM_REFERENCE: ${{ inputs.reference }}
        run: sh tests/ci/run.sh io-vm
      - name: Clean up QEMU
        if: always()
        run: sh tests/ci/cleanup-qemu.sh aarch64
      - name: Upload storage diagnostics and disks
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: io-vm-storage-evidence
          path: |
            target/app/aarch64/io-vm-reset-*
            target/app/aarch64/io-standby-*
          if-no-files-found: ignore
          retention-days: 7

  network:
    name: AArch64 / guest networking / GICv${{ matrix.gic }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        gic: [2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4
        with:
          version: 1.3.0
      - name: Install deployment and QEMU tools
        uses: ./.github/actions/tools
        with:
          packages: clang cmake cpio lld llvm make qemu-system-arm dosfstools mtools e2fsprogs squashfs-tools device-tree-compiler
      - name: Verify guest network and shared backend lifecycle
        env:
          IO_VM_REFERENCE: ${{ inputs.reference }}
          QEMU_MACHINE: virt,virtualization=on,gic-version=${{ matrix.gic }}
          QEMU_CPUS: 4
        run: sh tests/ci/run.sh io-network
      - name: Clean up AArch64 QEMU
        if: always()
        run: sh tests/ci/cleanup-qemu.sh aarch64
      - name: Upload network acceptance diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: io-vm-network-gicv${{ matrix.gic }}-evidence
          path: |
            target/board-tests/network.*/network.log
            target/board-tests/network.*/config.json
          if-no-files-found: ignore
          retention-days: 7
