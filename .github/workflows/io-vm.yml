# Linux and appliance builds/publication belong to HypeR-io-vm. This workflow
# consumes its published package to test the current HypeR kernel and apps.
name: HypeR / I/O VM integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      reference:
        description: Published package digest to test (defaults to scripts/io-vm.lock.json)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: io-vm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  storage:
    name: AArch64 / cross-VM physical storage
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d
        with:
          version: 1.3.0
      - name: Install SDK and QEMU tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            clang cmake cpio lld llvm make qemu-system-arm squashfs-tools
      - name: Test HypeR against the published I/O VM package
        env:
          IO_VM_REFERENCE: ${{ inputs.reference }}
        run: sh tests/ci/run.sh io-vm
      - name: Clean up QEMU
        if: always()
        run: sh tests/ci/cleanup-qemu.sh aarch64
      - name: Upload storage diagnostics and disks
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: io-vm-storage-evidence
          path: |
            target/app/aarch64/io-vm-reset-*
            target/app/aarch64/io-standby-*
          if-no-files-found: ignore
          retention-days: 7
