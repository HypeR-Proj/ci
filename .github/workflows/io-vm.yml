name: I/O VM package qualification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      reference:
        description: Public ghcr.io/OWNER/PACKAGE@sha256:DIGEST to qualify
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: io-vm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  storage:
    name: AArch64 / cross-VM physical storage
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6
        with:
          version: 1.3.0
      - name: Install SDK and QEMU tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            clang cmake cpio lld llvm make qemu-system-arm
      - name: Qualify the immutable I/O VM package
        env:
          IO_VM_REFERENCE: ${{ inputs.reference }}
        run: sh tests/ci/run.sh io-vm
      - name: Clean up QEMU
        if: always()
        run: sh tests/ci/cleanup-qemu.sh aarch64
      - name: Upload storage diagnostics and disks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: io-vm-storage-evidence
          path: |
            target/app/aarch64/io-vm-reset-*
            target/app/aarch64/io-standby-*
          if-no-files-found: ignore
          retention-days: 7
