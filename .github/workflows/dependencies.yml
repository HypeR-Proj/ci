name: Dependency review
on:
  pull_request:
    paths:
      - '**/Cargo.lock'
      - '.github/workflows/dependencies.yml'
      - 'scripts/audit-dependencies.sh'
      - '.cargo/audit.toml'
  push:
    branches: [main]
    paths:
      - '**/Cargo.lock'
      - '.github/workflows/dependencies.yml'
      - 'scripts/audit-dependencies.sh'
      - '.cargo/audit.toml'
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  advisories:
    name: Dependencies / RustSec lockfile audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
      - name: Install pinned advisory client
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit all tracked Cargo graphs
        run: sh scripts/audit-dependencies.sh
