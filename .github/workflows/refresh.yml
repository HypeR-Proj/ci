name: Topic coordinator
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'Poll PR buttons, submit a topic, or explicitly bypass checks as administrator'
        type: choice
        options: [poll, submit, force-submit]
        default: poll
      target:
        description: 'topic:label or repository#PR (required for submission)'
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: topic-coordinator
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    environment: topic-control
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: HypeR-Proj/manifest
          path: manifest-input
          persist-credentials: false
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: HypeR-Proj
          permission-contents: write
          permission-pull-requests: write
          permission-checks: write
          permission-actions: write
      - env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          CI_TOPIC_STATE_POLICY: ${{ vars.CI_TOPIC_STATE_POLICY }}
          REQUEST_ACTION: ${{ inputs.action || 'poll' }}
          REQUEST_TARGET: ${{ inputs.target }}
          REQUEST_ACTOR: ${{ github.triggering_actor }}
        run: python3 tools/topics.py --manifest manifest-input/default.xml --action "$REQUEST_ACTION" --target "$REQUEST_TARGET" --actor "$REQUEST_ACTOR"
