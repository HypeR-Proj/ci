name: Repository documentation
on:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: HypeR-Proj/ci
          ref: ${{ github.repository == 'HypeR-Proj/ci' && github.sha || 'main' }}
          path: .documentation-control
          persist-credentials: false
      - name: Select candidate documentation tools
        id: tools
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number || 0 }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: python3 .documentation-control/tools/documentation.py
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: HypeR-Proj/docs
          ref: ${{ steps.tools.outputs.revision }}
          path: .documentation-tools
          persist-credentials: false
      - uses: ./.documentation-tools/.github/actions/documentation
        with:
          output: ${{ runner.temp }}/documentation
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: ${{ runner.temp }}/documentation/site
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
