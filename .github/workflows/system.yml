name: System verification
run-name: "${{ github.ref == 'refs/heads/main' && 'System verification' || 'System preview' }}: ${{ inputs.target }} [${{ inputs.request_id || 'manual' }}]"
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'main, repository#PR, or topic:label'
        type: string
        default: main
        required: true
      request_id:
        description: 'Coordinator request identity; leave empty for a manual run'
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: system-${{ github.ref }}-${{ inputs.target }}
  cancel-in-progress: false
jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      snapshot_hash: ${{ steps.identity.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: HypeR-Proj/manifest
          path: manifest-input
          persist-credentials: false
      - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4
        with:
          version: 1.3.0
      - name: Resolve the exact source and appliance candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ inputs.target }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 tools/workspace.py resolve --manifest manifest-input/default.xml --target "$CANDIDATE" --packages --output candidate.json
      - id: identity
        run: echo "sha256=$(sha256sum candidate.json | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: candidate
          path: candidate.json
          retention-days: 30
  pending:
    if: github.ref == 'refs/heads/main'
    needs: resolve
    environment: topic-control
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: HypeR-Proj/manifest
          path: manifest-input
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: candidate
      - name: Verify resolver output
        env:
          EXPECTED: ${{ needs.resolve.outputs.snapshot_hash }}
        run: echo "$EXPECTED  candidate.json" | sha256sum --check
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: HypeR-Proj
          permission-contents: read
          permission-pull-requests: read
          permission-checks: write
      - name: Publish controls and pending checks
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 tools/topics.py --manifest manifest-input/default.xml --action controls
          python3 tools/gate.py --snapshot candidate.json --outcome pending --url "$RUN_URL"
  plan:
    needs: [resolve, pending]
    if: always() && needs.resolve.result == 'success' && (needs.pending.result == 'success' || needs.pending.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      cases: ${{ steps.matrix.outputs.cases }}
      fixtures: ${{ steps.matrix.outputs.fixtures }}
      has_fixtures: ${{ steps.matrix.outputs.has_fixtures }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: candidate
      - name: Verify snapshot integrity
        env:
          EXPECTED: ${{ needs.resolve.outputs.snapshot_hash }}
        run: echo "$EXPECTED  candidate.json" | sha256sum --check
      - name: Read the case-owned execution matrix
        id: matrix
        run: |
          python3 tools/workspace.py checkout --snapshot candidate.json --directory "$RUNNER_TEMP/system"
          python3 "$RUNNER_TEMP/system/test-framework/runner.py" list > matrix.json
          python3 - <<'PYCODE'
          import json, os
          plan = json.load(open('matrix.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for name in ('cases', 'fixtures'):
                  print(name + '=' + json.dumps(plan[name], separators=(',', ':')), file=output)
              print('has_fixtures=' + str(bool(plan['fixtures']['include'])).lower(), file=output)
          PYCODE
  fixtures:
    needs: [resolve, plan]
    if: needs.plan.outputs.has_fixtures == 'true'
    runs-on: ubuntu-24.04
    container: debian:trixie-slim
    defaults:
      run:
        shell: bash
    env:
      ARCH: ${{ matrix.arch }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.fixtures) }}
    steps:
      - name: Bootstrap the supported QEMU environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get -o Acquire::Retries=2 update
          apt-get install -y --no-install-recommends ca-certificates git python3 rustup build-essential curl xz-utils zstd unzip
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/system-environment
        with:
          snapshot-hash: ${{ needs.resolve.outputs.snapshot_hash }}
      - name: Build the immutable fixture once
        run: python3 "$RUNNER_TEMP/system/test-framework/runner.py" fixture "${{ matrix.name }}" --arch "${{ matrix.arch }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: fixture-${{ matrix.id }}
          path: ${{ runner.temp }}/system-out/fixtures/${{ matrix.id }}/
          if-no-files-found: error
          retention-days: 7
      - name: Collect diagnostics and timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: fixtures-${{ matrix.id }}
          path: |
            ${{ runner.temp }}/system-out/**/*.log
            ${{ runner.temp }}/system-out/results/*.json
          if-no-files-found: ignore
  test:
    needs: [resolve, plan, fixtures]
    if: always() && needs.plan.result == 'success' && (needs.fixtures.result == 'success' || needs.fixtures.result == 'skipped')
    runs-on: ubuntu-24.04
    container: debian:trixie-slim
    defaults:
      run:
        shell: bash
    env:
      ARCH: ${{ matrix.arch }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.cases) }}
    steps:
      - name: Bootstrap the supported QEMU environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get -o Acquire::Retries=2 update
          apt-get install -y --no-install-recommends ca-certificates git python3 rustup build-essential curl xz-utils zstd unzip
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/system-environment
        with:
          snapshot-hash: ${{ needs.resolve.outputs.snapshot_hash }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: matrix.fixture != ''
        with:
          name: fixture-${{ matrix.fixture }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/system-out/fixtures/${{ matrix.fixture }}-${{ matrix.arch }}
      - name: Execute the selected system case
        env:
          CI_REQUIRE_FIXTURES: '1'
        run: python3 "$RUNNER_TEMP/system/test-framework/runner.py" run "${{ matrix.id }}"
      - name: Collect diagnostics and timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: test-${{ matrix.id }}
          path: |
            ${{ runner.temp }}/system-out/**/*.log
            ${{ runner.temp }}/system-out/results/*.json
          if-no-files-found: ignore
  result:
    if: always() && github.ref == 'refs/heads/main' && needs.resolve.result == 'success'
    environment: topic-control
    needs: [resolve, pending, plan, fixtures, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: candidate
      - name: Verify trusted resolver output
        env:
          EXPECTED: ${{ needs.resolve.outputs.snapshot_hash }}
        run: echo "$EXPECTED  candidate.json" | sha256sum --check
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: HypeR-Proj
          permission-contents: read
          permission-pull-requests: read
          permission-checks: write
      - name: Publish exact-candidate result
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          OUTCOME: ${{ needs.pending.result == 'success' && needs.plan.result == 'success' && (needs.fixtures.result == 'success' || needs.fixtures.result == 'skipped') && needs.test.result == 'success' && 'success' || 'failure' }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 tools/gate.py --snapshot candidate.json --outcome "$OUTCOME" --url "$RUN_URL"
