name: System verification
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'main, repository#PR, or topic:label'
        type: string
        default: main
        required: true
permissions:
  contents: read
concurrency:
  group: system-${{ inputs.target }}
  cancel-in-progress: false
jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      snapshot_hash: ${{ steps.identity.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: HypeR-Proj/manifest
          path: manifest-input
          persist-credentials: false
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: HypeR-Proj
          permission-contents: read
          permission-pull-requests: read
          permission-checks: write
      - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4
        with:
          version: 1.3.0
      - name: Resolve candidate and mark checks pending
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          CANDIDATE: ${{ inputs.target }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 tools/workspace.py resolve --manifest manifest-input/default.xml --target "$CANDIDATE" --packages --output candidate.json
          python3 tools/gate.py --snapshot candidate.json --outcome pending --url "$RUN_URL"
      - id: identity
        run: echo "sha256=$(sha256sum candidate.json | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: candidate
          path: candidate.json
          retention-days: 30
  test:
    needs: resolve
    runs-on: ubuntu-24.04
    container: debian:trixie-slim
    defaults:
      run:
        shell: bash
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        suite:
          - scripts
          - quality
          - kernel-configurations
          - aarch64-build
          - aarch64-production
          - aarch64-self-test
          - aarch64-compact
          - aarch64-qemu
          - native-sdk
          - native-gicv3
          - native-gicv2
          - native-smp-stack
          - native-stack-16k
          - native-pmu
          - native-trace
          - native-scheduler
          - board-storage
          - io-vm
          - io-network
          - io-network-mmio
          - riscv64-native
          - riscv64-qemu
          - x86_64-build
    steps:
      - name: Bootstrap the supported QEMU environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get -o Acquire::Retries=2 update
          apt-get install -y --no-install-recommends ca-certificates git python3 rustup build-essential curl xz-utils zstd unzip
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: candidate
      - name: Verify snapshot integrity
        env:
          EXPECTED: ${{ needs.resolve.outputs.snapshot_hash }}
        run: echo "$EXPECTED  candidate.json" | sha256sum --check
      - name: Install build and test tools
        run: |
          apt-get update
          apt-get install -y clang cmake cpio lld llvm make python3 ripgrep shellcheck dosfstools mtools e2fsprogs erofs-utils squashfs-tools device-tree-compiler qemu-system-arm qemu-system-misc
      - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4
        with:
          version: 1.3.0
      - name: Check out candidate workspace
        run: |
          python3 tools/workspace.py checkout --snapshot candidate.json --directory "$RUNNER_TEMP/system"
          python3 "$RUNNER_TEMP/system/project.py" prepare
      - name: Install selected Rust toolchain
        run: |
          cd "$RUNNER_TEMP/system"
          toolchain=$(sed -n 's/^channel = "\([^"]*\)"$/\1/p' rust-toolchain.toml)
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --profile minimal --component rust-src --component llvm-tools --component clippy --component rustfmt --target aarch64-unknown-none --target aarch64-unknown-none-softfloat --target riscv64imac-unknown-none-elf --target riscv64gc-unknown-none-elf --target x86_64-unknown-none
          rustup default "$toolchain"
      - name: Download the resolved appliance
        run: echo "IO_VM_PACKAGE=$(python3 tools/package.py --snapshot candidate.json --workspace "$RUNNER_TEMP/system" --platform qemu)" >> "$GITHUB_ENV"
      - name: Run system acceptance
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          cd "$RUNNER_TEMP/system"
          sh tests/ci/run.sh "$SUITE"
      - name: Collect diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: system-${{ matrix.suite }}
          path: |
            ${{ runner.temp }}/system/source-inventory.json
            ${{ runner.temp }}/system/target/**/*.log
            ${{ runner.temp }}/system/kernel/target/**/*.log
          if-no-files-found: ignore
  pi5:
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        profile: [native, io-bringup, sd]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: candidate
      - name: Verify snapshot integrity
        env:
          EXPECTED: ${{ needs.resolve.outputs.snapshot_hash }}
        run: echo "$EXPECTED  candidate.json" | sha256sum --check
      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake cpio lld llvm make dosfstools mtools e2fsprogs erofs-utils squashfs-tools device-tree-compiler xz-utils qemu-system-arm
      - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4
        with:
          version: 1.3.0
      - name: Check out candidate and install Rust
        run: |
          python3 tools/workspace.py checkout --snapshot candidate.json --directory "$RUNNER_TEMP/system"
          python3 "$RUNNER_TEMP/system/project.py" prepare
          cd "$RUNNER_TEMP/system"
          toolchain=$(sed -n 's/^channel = "\([^"]*\)"$/\1/p' rust-toolchain.toml)
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --profile minimal --component rust-src --component llvm-tools --target aarch64-unknown-none
          rustup default "$toolchain"
      - name: Download the resolved appliance and corresponding sources
        if: matrix.profile != 'native'
        run: echo "IO_VM_PACKAGE=$(python3 tools/package.py --snapshot candidate.json --workspace "$RUNNER_TEMP/system" --platform rpi5 --materials)" >> "$GITHUB_ENV"
      - name: Build image and corresponding source assets
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          args=()
          if [ "$PROFILE" != native ]; then
            args+=(--io-package "$IO_VM_PACKAGE")
          fi
          python3 "$RUNNER_TEMP/system/pi5-images/scripts/build.py" --source "$RUNNER_TEMP/system" --profile "$PROFILE" "${args[@]}"
      - name: Exercise generated boot payloads
        if: matrix.profile != 'sd'
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          args=()
          if [ "$PROFILE" = io-bringup ]; then
            args+=(--vm-config "$RUNNER_TEMP/system/target/board/rpi5-native/bringup/vms.json")
          fi
          python3 "$RUNNER_TEMP/system/pi5-images/scripts/smoke.py" --profile "$PROFILE" \
            --kernel "$RUNNER_TEMP/system/kernel/target/aarch64-unknown-none/kernel/hyper.img" \
            --initramfs "$RUNNER_TEMP/system/target/board/rpi5-native/bootstrap.cpio" \
            --log "$RUNNER_TEMP/pi5-smoke.log" "${args[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: pi5-${{ matrix.profile }}
          path: |
            ${{ runner.temp }}/system/pi5-images/dist/${{ matrix.profile }}/
            ${{ runner.temp }}/pi5-smoke.log
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 7
  result:
    if: always() && needs.resolve.result == 'success'
    needs: [resolve, test, pi5]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: candidate
      - name: Verify trusted resolver output
        env:
          EXPECTED: ${{ needs.resolve.outputs.snapshot_hash }}
        run: echo "$EXPECTED  candidate.json" | sha256sum --check
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: HypeR-Proj
          permission-contents: read
          permission-pull-requests: read
          permission-checks: write
      - name: Publish exact-candidate result
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          OUTCOME: ${{ needs.test.result == 'success' && needs.pi5.result == 'success' && 'success' || 'failure' }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 tools/gate.py --snapshot candidate.json --outcome "$OUTCOME" --url "$RUN_URL"
