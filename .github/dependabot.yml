version: 2
updates:
  - package-ecosystem: pip
    directory: /scripts/docs
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5


  # Application and smoke consumers resolve unpublished SDK crates through the
  # installed SDK; those roots remain a deliberate manual update boundary.
  - package-ecosystem: cargo
    directories:
      - /kernel
      - /kernel/tests/host
      - /kernel/tools/kallsyms
      - /lib/rust
      - /tools/fit-pack
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
