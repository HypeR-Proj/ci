name: Set up HypeR toolchain
description: Install the pinned Rust toolchain and bare-metal targets

runs:
  using: composite
  steps:
    - name: Allow Git access to the checked-out workspace
      shell: bash
      run: |
        # Container jobs run as root against a runner-owned bind mount.
        # Checkout's temporary Git config does not persist into build steps.
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        git ls-files --stage >/dev/null
    - name: Snapshot Cargo cache key
      id: cargo-cache
      shell: bash
      run: |
        # The cache post-step must not rescan root-owned generated directories
        # on the host after a container build. Only tracked locks define inputs.
        lockfiles=$(git ls-files -z -- '**/Cargo.lock' | xargs -0 sha256sum | sha256sum | cut -d ' ' -f 1)
        echo "key=cargo-$RUNNER_OS-$lockfiles" >> "$GITHUB_OUTPUT"
    - name: Cache Cargo downloads
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry/cache
          ~/.cargo/registry/index
          ~/.cargo/git/db
        key: ${{ steps.cargo-cache.outputs.key }}
        restore-keys: |
          cargo-${{ runner.os }}-
    - name: Install Rust toolchain
      shell: bash
      run: |
        toolchain=$(sed -n 's/^channel = "\([^"]*\)"$/\1/p' rust-toolchain.toml)
        if [ -z "$toolchain" ]; then
          echo "rust-toolchain.toml does not declare a channel" >&2
          exit 1
        fi
        rustup set profile minimal
        rustup toolchain install "$toolchain" \
          --component clippy \
          --component llvm-tools \
          --component rust-src \
          --component rustfmt \
          --target aarch64-unknown-none \
          --target aarch64-unknown-none-softfloat \
          --target riscv64imac-unknown-none-elf \
          --target riscv64gc-unknown-none-elf \
          --target x86_64-unknown-none
        rustup default "$toolchain"
