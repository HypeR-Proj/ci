name: System execution environment
description: Prepare a verified candidate and its published appliance without App credentials
inputs:
  snapshot-hash:
    required: true
    description: SHA-256 of the resolver artifact
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: candidate
    - name: Verify the source snapshot
      shell: bash
      env:
        EXPECTED: ${{ inputs.snapshot-hash }}
      run: echo "$EXPECTED  candidate.json" | sha256sum --check
    - name: Install build and emulator tools
      shell: bash
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        apt-get -o Acquire::Retries=2 update
        apt-get install -y --no-install-recommends clang cmake cpio lld llvm make ripgrep shellcheck dosfstools mtools e2fsprogs erofs-utils squashfs-tools device-tree-compiler qemu-system-arm qemu-system-misc
    - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4
      with:
        version: 1.3.0
    - name: Check out the exact candidate
      shell: bash
      run: |
        python3 tools/workspace.py checkout --snapshot candidate.json --directory "$RUNNER_TEMP/system"
        echo "OUT=$RUNNER_TEMP/system-out" >> "$GITHUB_ENV"
        echo "HYPER_SOURCE_IDENTITY=$(python3 -c 'import json; print(json.load(open("candidate.json"))["identity"])')" >> "$GITHUB_ENV"
    - name: Install the selected Rust toolchain
      shell: bash
      run: |
        cd "$RUNNER_TEMP/system"
        python3 - <<'PY'
        import subprocess, tomllib
        from pathlib import Path
        policy = tomllib.loads(Path('rust-toolchain.toml').read_text())['toolchain']
        command = ['rustup', 'toolchain', 'install', policy['channel'], '--profile', 'minimal']
        for component in policy.get('components', []):
            command.extend(['--component', component])
        for target in policy.get('targets', []):
            command.extend(['--target', target])
        subprocess.run(command, check=True)
        PY
    - name: Prepare the execution view and import the resolved appliance
      shell: bash
      run: |
        python3 "$RUNNER_TEMP/system/project.py" prepare
        echo "IO_VM_PACKAGE=$(python3 tools/package.py --snapshot candidate.json --workspace "$RUNNER_TEMP/system" --platform qemu)" >> "$GITHUB_ENV"
