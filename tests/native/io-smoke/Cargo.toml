[package]
name = "hyper-io-smoke"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

# The initial /init must be static, independently of the system VM runtime's
# dynamic delivery graph. Reuse the implementation libraries, not their DSOs.
[workspace]

[dependencies]
hyper-os = { version = "=0.0.0", features = ["std"] }
hyper-rt = { version = "=0.0.0", features = ["std"] }
hyper-vm-image = { path = "../../../lib/vm-image" }
hyper-vm-policy = { path = "../../../lib/vm-policy" }
hyper-vm-support = { path = "../../../lib/vm-support" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("hyper"))'] }

[profile.release]
codegen-units = 1
debug = 1
incremental = false
lto = "fat"
opt-level = "s"
overflow-checks = true
panic = "abort"
strip = "none"
