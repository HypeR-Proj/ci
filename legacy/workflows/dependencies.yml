name: Dependency review
on:
  pull_request:
    paths:
      - '**/Cargo.lock'
      - '.github/workflows/dependencies.yml'
      - 'scripts/audit-dependencies.sh'
      - '.cargo/audit.toml'
  push:
    branches: [main]
    paths:
      - '**/Cargo.lock'
      - '.github/workflows/dependencies.yml'
      - 'scripts/audit-dependencies.sh'
      - '.cargo/audit.toml'
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  advisories:
    name: Dependencies / RustSec lockfile audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Install pinned advisory client
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit all tracked Cargo graphs
        run: sh scripts/audit-dependencies.sh
